name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to rebelatto.tech
    runs-on: [self-hosted, linux, rebelatto]
    timeout-minutes: 25

    steps:
      - name: Pull and rebuild
        run: |
          set -euo pipefail
          APP_DIR="/opt/rebelatto"
          cd "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main
          docker compose up -d --build
          docker compose ps
