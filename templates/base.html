{% load static %}
<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rebel Tech — {{ site.nome }}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Portfolio de {{ site.nome }} sob a marca Rebel Tech. Desenvolvimento de software moderno e escalável.{% endblock %}">
  <link rel="icon" href="{% static 'img/favicon.png' %}" type="image/png">
  <link rel="apple-touch-icon" href="{% static 'img/favicon.png' %}">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("rebel-theme");
        var theme = stored === "dark" || stored === "light" ? stored : "dark";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="bg-aurora" aria-hidden="true">
    <span class="bg-aurora__blob bg-aurora__blob--a"></span>
    <span class="bg-aurora__blob bg-aurora__blob--b"></span>
    <span class="bg-aurora__blob bg-aurora__blob--c"></span>
  </div>

  {% include "portfolio/partials/nav.html" %}

  <main id="conteudo">
    {% block content %}{% endblock %}
  </main>

  {% include "portfolio/partials/footer.html" %}

  <script src="{% static 'js/main.js' %}" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
