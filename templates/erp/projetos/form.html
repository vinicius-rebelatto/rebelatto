{% extends "erp/base.html" %}

{% block content %}
<section class="erp-card">
  <form method="post" enctype="multipart/form-data" class="erp-form erp-form--grid">
    {% csrf_token %}
    {% for field in form %}
    <label class="erp-field {% if field.name == 'resumo' %}erp-field--full{% endif %}">
      <span>{{ field.label }}</span>
      {{ field }}
      {% if field.help_text %}<small class="erp-muted">{{ field.help_text }}</small>{% endif %}
      {% if field.errors %}<span class="erp-error">{{ field.errors|striptags }}</span>{% endif %}
    </label>
    {% endfor %}
    <div class="erp-form__actions erp-field--full">
      <button class="btn btn-primary" type="submit">
        {% include "erp/partials/icon.html" with name="save" %}
        <span>Salvar</span>
      </button>
      <a class="btn btn-outline" href="{% url 'erp:project_list' %}">
        {% include "erp/partials/icon.html" with name="back" %}
        <span>Voltar</span>
      </a>
      {% if project %}
      <button class="btn btn-outline" type="submit" form="delete-project" onclick="return confirm('Excluir projeto?')">
        {% include "erp/partials/icon.html" with name="trash" %}
        <span>Excluir</span>
      </button>
      {% endif %}
    </div>
  </form>
  {% if project %}
  <form id="delete-project" method="post" action="{% url 'erp:project_delete' project.pk %}">{% csrf_token %}</form>
  {% endif %}
</section>
{% endblock %}
