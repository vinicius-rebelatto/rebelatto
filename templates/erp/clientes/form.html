{% extends "erp/base.html" %}

{% block content %}
<section class="erp-card">
  <form method="post" class="erp-form erp-form--grid" enctype="multipart/form-data">
    {% csrf_token %}
    {% for field in form %}
    <label class="erp-field {% if field.name in 'mensagem,motivo_rejeicao,notas' %}erp-field--full{% endif %}">
      <span>{{ field.label }}</span>
      {{ field }}
      {% if field.errors %}<span class="erp-error">{{ field.errors|striptags }}</span>{% endif %}
    </label>
    {% endfor %}
    <div class="erp-form__actions erp-field--full">
      <button class="btn btn-primary" type="submit">
        {% include "erp/partials/icon.html" with name="save" %}
        <span>Salvar</span>
      </button>
      <a class="btn btn-outline" href="{% if cliente %}{% url 'erp:cliente_detail' cliente.pk %}{% else %}{% url 'erp:cliente_list' %}{% endif %}">
        {% include "erp/partials/icon.html" with name="x" %}
        <span>Cancelar</span>
      </a>
    </div>
  </form>
</section>
{% endblock %}
