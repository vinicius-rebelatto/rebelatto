{# Usage: {% include "ia/partials/field.html" with field=form.x full=True %} #}
{% if field.field.widget.input_type == "checkbox" %}
<label class="erp-field erp-field--check{% if full %} erp-field--full{% endif %}">
  {{ field }}
  <span>{{ field.label }}</span>
  {% if field.errors %}<span class="erp-error">{{ field.errors|striptags }}</span>{% endif %}
</label>
{% else %}
<label class="erp-field{% if full %} erp-field--full{% endif %}">
  <span>{{ field.label }}</span>
  {{ field }}
  {% if field.help_text %}<small class="erp-help">{{ field.help_text }}</small>{% endif %}
  {% if field.errors %}<span class="erp-error">{{ field.errors|striptags }}</span>{% endif %}
</label>
{% endif %}
