# Exemplo para /etc/nginx/sites-available/rebelatto.tech
# Depois:
#   ln -s /etc/nginx/sites-available/rebelatto.tech /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d rebelatto.tech -d www.rebelatto.tech
#
# Observação: com o app em /root/opt/..., o nginx (www-data) não consegue
# ler static/media via alias. Prefira proxy total para o Gunicorn/WhiteNoise.

upstream rebelatto_web {
    server 127.0.0.1:8010;
}

server {
    listen 80;
    listen [::]:80;
    server_name rebelatto.tech www.rebelatto.tech;

    client_max_body_size 25M;

    location / {
        proxy_pass http://rebelatto_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
